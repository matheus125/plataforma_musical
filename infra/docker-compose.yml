services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: music_performance
      POSTGRES_USER: music_user
      POSTGRES_PASSWORD: music_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d music_performance"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_NAME: Plataforma de Performance Musical
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: music_performance
      DB_USERNAME: music_user
      DB_PASSWORD: music_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      REDIS_CLIENT: predis
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cp -n .env.example .env && composer install --no-interaction --prefer-dist && php artisan key:generate --force && (php artisan storage:link || true) && php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_NAME: Plataforma de Performance Musical
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: music_performance
      DB_USERNAME: music_user
      DB_PASSWORD: music_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
    volumes:
      - ../backend:/var/www/html
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan queue:work redis --sleep=1 --tries=3 --timeout=120"

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres-data:
